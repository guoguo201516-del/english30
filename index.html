<title>30 天英语自学 · 第 1 周</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#19202f;--ink:#eaf0ff;--muted:#9aa7c7;--line:#2a3350;--accent:#7b9bff;--on-accent:#0f1420}}
:root[data-theme="dark"]{--bg:#0f1420;--surface:#19202f;--ink:#eaf0ff;--muted:#9aa7c7;--line:#2a3350;--accent:#7b9bff;--on-accent:#0f1420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.top{color:var(--muted);font-size:14px;margin:0 0 8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.tabs button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opts{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.day{color:var(--accent);font-weight:700;font-size:15px;margin:18px 0 0}
h1{font-size:28px;line-height:1.25;margin:2px 0 0}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.task p{margin:0}
.bar{margin:22px 0 8px}
h2{font-size:17px;margin:0}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.txt{flex:1;min-width:0}
.en{font-size:20px;font-weight:600;line-height:1.3}
.zh{color:var(--muted);font-size:14px}
.quiz .zh:not(.show){visibility:hidden}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.say.on{background:var(--play);color:var(--on-play)}
.say svg{width:24px;height:24px}
button:focus-visible,input:focus-visible{outline:3px solid var(--play);outline-offset:2px}
.checks{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.checks label{display:flex;gap:12px;align-items:center;padding:12px 0;font-size:17px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.msg{color:var(--muted);font-size:14px;margin-top:12px}
[hidden]{display:none!important}
#lock{padding-top:24px}
#lock input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:12px 0;text-transform:uppercase}
</style>
</head>

function B64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++){u[i]=b.charCodeAt(i);}return u;}
async function unlock(code){
  code=String(code).trim().toUpperCase();
  var id=code.split("-")[0];
  if(!Object.prototype.hasOwnProperty.call(K,id)){return false;}
  var e=K[id];
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
    var wk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:B64(e.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:B64(e.i)},wk,B64(e.w));
    var ck=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:B64(C.i)},ck,B64(C.d));
    D=JSON.parse(new TextDecoder().decode(pt));
    return true;
  }catch(err){return false;}
}

var synth=window.speechSynthesis,slow=false,view=document.getElementById("view"),tabs=document.getElementById("tabs");
function say(text,btn){
  if(!synth){document.getElementById("msg").hidden=false;return;}
  synth.cancel();
  var on=document.querySelectorAll(".say.on");
  for(var i=0;i<on.length;i++){on[i].classList.remove("on");}
  var u=new SpeechSynthesisUtterance(text.replace(/___/g,"").replace(/’/g,"'"));
  u.lang="en-US";u.rate=slow?0.6:0.9;
  var vs=synth.getVoices()||[];
  for(var j=0;j<vs.length;j++){if(/^en[-_]US/i.test(vs[j].lang)){u.voice=vs[j];break;}}
  u.onstart=function(){btn.classList.add("on");};
  u.onend=u.onerror=function(){btn.classList.remove("on");};
  synth.speak(u);
}
function li(it){return '<li><div class="txt"><div class="en">'+it[0]+'</div><div class="zh">'+it[1]+'</div></div><button class="say" data-s="'+(it[2]||it[0])+'" aria-label="朗读">'+icon+'</button></li>';}
var saved={};
try{saved=JSON.parse(localStorage.getItem("eng30-w1")||"{}");}catch(e){saved={};}
function show(n){
  var d=D[n-1];
  var h='<p class="day">第 '+n+' 天</p><h1>'+d.t+'</h1><div class="task"><p>今日任务：'+d.k+'</p></div>';
  h+='<div class="bar"><h2>今日内容</h2></div><ul>'+d.i.map(li).join("")+'</ul>';
  if(n>1&&n<7){h+='<div class="bar"><h2>5 分钟复习：第 '+(n-1)+' 天的内容</h2></div><ul>'+D[n-2].i.slice(0,5).map(li).join("")+'</ul>';}

  var bs=tabs.children;
  for(var j=0;j<bs.length;j++){bs[j].setAttribute("aria-current",String(j+1===n));}
  window.scrollTo(0,0);
}

});

});
var sb=document.getElementById("slow"),qb=document.getElementById("quiz");
sb.addEventListener("click",function(){slow=!slow;sb.setAttribute("aria-pressed",String(slow));sb.textContent=slow?"慢速：开":"慢速：关";});
qb.addEventListener("click",function(){var q=document.body.classList.toggle("quiz");qb.setAttribute("aria-pressed",String(q));qb.textContent=q?"遮住中文：开":"遮住中文：关";});
function enter(){document.getElementById("lock").hidden=true;document.getElementById("app").hidden=false;fromHash();}
async function tryCode(code,remember){
  var ok=await unlock(code);
  if(ok){if(remember){try{localStorage.setItem("eng30-code",String(code).trim().toUpperCase());}catch(e){}}enter();}
  return ok;
}
document.getElementById("go").addEventListener("click",async function(){
  var err=document.getElementById("err");err.hidden=true;
  if(!window.crypto||!crypto.subtle){err.textContent="这个浏览器不支持，请改用 Chrome 或 Safari 打开。";err.hidden=false;return;}
  var btn=this;btn.disabled=true;btn.textContent="验证中…";
  var ok=await tryCode(document.getElementById("code").value,true);
  btn.disabled=false;btn.textContent="开始学习";
  if(!ok){err.textContent="学习码不正确，请检查后重试。";err.hidden=false;}
});
(function(){var s=null;try{s=localStorage.getItem("eng30-code");}catch(e){}if(s&&window.crypto&&crypto.subtle){tryCode(s,false);}})();
</script>
